<!DOCTYPE html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="stylesheet" href="/style.css">
{{schema}}
</head>
<body>
<header class="site-header"><div class="header-inner">
<a class="site-name" href="/">{{site_name}}</a>
<nav class="main-nav" aria-label="Main">{{nav}} <a href="/about/">About</a> <a href="/contact/">Contact</a></nav>
</div></header>
<main><article>{{breadcrumbs}}{{content}}{{faq}}{{cta}}{{related}}</article></main>
<footer class="site-footer"><div class="footer-inner"><div><h2>{{site_name}}</h2><p>{{site_description}}</p></div></div></footer>
</body>
</html>
